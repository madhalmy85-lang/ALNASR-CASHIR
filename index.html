<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كاشير مكتبة النصر</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

header {
    background: #1f4e79;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 15px;
    box-shadow: 0 3px 10px #0001;
}

input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 12px 18px;
    margin: 5px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.primary {
    background: #1f4e79;
    color: white;
}

.success {
    background: #198754;
    color: white;
}

.danger {
    background: #dc3545;
    color: white;
}

.center {
    text-align: center;
}

#reader {
    max-width: 500px;
    margin: auto;
}

.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.total {
    font-size: 25px;
    font-weight: bold;
    text-align: center;
    margin: 20px 0;
}

#barcodePreview {
    max-width: 100%;
}

</style>
</head>


<body>

<header>

<h1>🧾 مكتبة النصر</h1>

<p>نظام الكاشير والباركود</p>

</header>


<div class="container">


<!-- إنشاء باركود -->

<div class="card">

<h2>🏷️ إنشاء باركود</h2>

<input
id="productName"
type="text"
placeholder="اسم المنتج">

<input
id="productPrice"
type="number"
step="0.01"
placeholder="السعر">

<button
class="primary"
onclick="generateBarcode()">

إنشاء الباركود

</button>

<div class="center">

<svg id="barcodePreview"></svg>

<p id="barcodeNumber"></p>

</div>

<button
class="success"
onclick="printBarcode()">

🖨️ طباعة الباركود

</button>

</div>


<!-- إضافة منتج -->

<div class="card">

<h2>📦 المنتجات</h2>

<input
id="barcodeInput"
type="text"
placeholder="رقم الباركود">

<input
id="nameInput"
type="text"
placeholder="اسم المنتج">

<input
id="priceInput"
type="number"
step="0.01"
placeholder="السعر">

<button
class="success"
onclick="saveProduct()">

💾 حفظ المنتج

</button>

</div>


<!-- قارئ الباركود -->

<div class="card">

<h2>📷 قارئ الباركود</h2>

<button
class="primary"
onclick="startScanner()">

تشغيل الكاميرا

</button>

<button
class="danger"
onclick="stopScanner()">

إيقاف الكاميرا

</button>

<div id="reader"></div>

</div>


<!-- السلة -->

<div class="card">

<h2>🛒 سلة المشتريات</h2>

<div id="cart">

السلة فارغة

</div>

<div class="total">

الإجمالي:
<span id="total">0.00</span>

</div>

<button
class="danger"
onclick="clearCart()">

تفريغ السلة

</button>

<button
class="primary"
onclick="printInvoice()">

🧾 طباعة الفاتورة

</button>

</div>


</div>

JSON.parse(localStorage.getItem("nasrProducts") || "{}");

let scanner = null;

إنشاء رقم باركود
